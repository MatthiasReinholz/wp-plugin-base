name: foundation-ci

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: foundation-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate foundation (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php-version:
          - '8.2'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ matrix.php-version }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'

      - name: Install foundation assurance tools
        run: |
          bash scripts/ci/install_lint_tools.sh "$RUNNER_TEMP/wp-plugin-base-tools"
          bash scripts/release/install_release_security_tools.sh "$RUNNER_TEMP/wp-plugin-base-tools"
          echo "$RUNNER_TEMP/wp-plugin-base-tools" >> "$GITHUB_PATH"

      - name: Validate foundation
        env:
          WP_PLUGIN_BASE_STRICT_LINTERS: 'true'
        run: bash scripts/foundation/validate.sh --mode ci

  validate-strict-local-bootstrap:
    name: Validate strict-local bootstrap
    needs: [validate, validate-full, runtime-wordpress, bootstrap-strict-local]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require every prerequisite to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          jq -e '
            keys == ["bootstrap-strict-local", "runtime-wordpress", "validate", "validate-full"]
            and all(.[]; .result == "success")
          ' <<< "$NEEDS_JSON"

  bootstrap-strict-local:
    name: Validate clean strict-local environment
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.2'

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'

      - name: Bootstrap strict-local foundation tools
        run: |
          bash scripts/foundation/bootstrap_strict_local.sh "$RUNNER_TEMP/wp-plugin-base-tools"
          echo "$RUNNER_TEMP/wp-plugin-base-tools" >> "$GITHUB_PATH"

      - name: Validate foundation strict-local mode
        env:
          WP_PLUGIN_BASE_STRICT_LINTERS: 'true'
        run: bash scripts/foundation/validate.sh --mode strict-local

  validate-full:
    name: Validate full foundation suite (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        php-version:
          - '8.2'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ matrix.php-version }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'

      - name: Install foundation assurance tools
        run: |
          bash scripts/ci/install_lint_tools.sh "$RUNNER_TEMP/wp-plugin-base-tools"
          bash scripts/release/install_release_security_tools.sh "$RUNNER_TEMP/wp-plugin-base-tools"
          echo "$RUNNER_TEMP/wp-plugin-base-tools" >> "$GITHUB_PATH"

      - name: Validate full foundation
        env:
          WP_PLUGIN_BASE_STRICT_LINTERS: 'true'
          WP_PLUGIN_BASE_SKIP_FAST_VALIDATE: 'true'
          WP_PLUGIN_BASE_TEST_WP_CORE: WordPress/WordPress#7.1.2
          WP_PLUGIN_BASE_TEST_PHP_VERSION: '8.2'
        run: bash scripts/foundation/validate-full.sh --mode ci

  runtime-wordpress:
    name: WordPress ${{ matrix.core }} runtime (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {core: '7.1.2', php: '8.2'}
          - {core: '7.1.2', php: '8.3'}
          - {core: '7.1.2', php: '8.4'}
          - {core: '7.1.2', php: '8.5'}
          - {core: '6.9', php: '8.3'}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ matrix.php }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Run language and real WordPress contracts
        env:
          WP_PLUGIN_BASE_TEST_WP_CORE: WordPress/WordPress#${{ matrix.core }}
          WP_PLUGIN_BASE_TEST_PHP_VERSION: ${{ matrix.php }}
          WP_PLUGIN_BASE_TEST_ADMIN_VARIANT: basic
        run: |
          bash scripts/foundation/test_rest_operations_pack_contracts.sh
          bash scripts/foundation/test_runtime_class_isolation.sh
          bash scripts/foundation/test_runtime_packs_wordpress.sh

  release-security-smoke:
    name: Release security smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.2'

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'

      - name: Install release security tools
        run: |
          bash scripts/release/install_release_security_tools.sh "$RUNNER_TEMP/wp-plugin-base-release-tools"
          echo "$RUNNER_TEMP/wp-plugin-base-release-tools" >> "$GITHUB_PATH"

      - name: Run release security smoke
        run: bash scripts/foundation/run_release_security_smoke.sh --mode ci
